services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nli
      POSTGRES_PASSWORD: nli_pass
      POSTGRES_DB: newlookimpex
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://nli:nli_pass@db:5432/newlookimpex
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend, args: { NEXT_PUBLIC_API_URL: http://localhost:8000 } }
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata: {}
